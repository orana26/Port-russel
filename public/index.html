<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port de Plaisance Russell</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>Port de Plaisance Russell</h1>
    <p>Bienvenue sur le portail de gestion du port de plaisance.</p>
  </header>

  <main>
    <section>
      <h2>Connexion</h2>
      <form id="loginForm">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >

        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Se connecter</button>
        <p id="loginMessage" role="alert"></p>
      </form>
    </section>

    <p>
      <a href="/api-docs">Consulter la documentation de l'API</a>
    </p>
  </main>

  <footer>
    <p>&copy; 2026 Port de Plaisance Russell</p>
  </footer>
</body>
</html>
